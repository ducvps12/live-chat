name: Deploy NemarkChat to Windows VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nemarkchat-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Production test gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Build and verify auto-reply invariants
        run: npm run verify:production

  deploy:
    name: Deploy and verify production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        shell: bash
        run: |
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          test -n "$SERVER_USER" || { echo 'Missing SERVER_USER'; exit 1; }
          test -n "$SERVER_PASSWORD" || { echo 'Missing SERVER_PASSWORD'; exit 1; }

      - name: Deploy through SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Location ''C:\Users\Administrator\Desktop\live-chat\live-chat''; $expectedSha = ''${{ github.sha }}''; git config core.autocrlf true; git fetch origin main; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; git diff --cached --quiet --; if ($LASTEXITCODE -ne 0) { Write-Output ''Staged production changes detected; deployment stopped.''; exit 18 }; $dirty = @(git status --porcelain=v1 --untracked-files=no); if ($dirty.Count -gt 0) { $stamp = Get-Date -Format ''yyyyMMdd-HHmmss''; git stash push -m "pre-cicd-$stamp" -- .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Write-Output "Saved production worktree as pre-cicd-$stamp" }; git pull --ff-only origin main; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $actualSha = (git rev-parse HEAD).Trim(); if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if ($actualSha -ne $expectedSha) { Write-Output "Release mismatch: expected $expectedSha, got $actualSha. Deployment stopped."; exit 19 }; & ''scripts\deploy-windows.ps1''"'
