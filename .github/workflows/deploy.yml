name: Deploy NemarkChat to Windows VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nemarkchat-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        shell: bash
        run: |
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          test -n "$SERVER_USER" || { echo 'Missing SERVER_USER'; exit 1; }
          test -n "$SERVER_PASSWORD" || { echo 'Missing SERVER_PASSWORD'; exit 1; }

      - name: Deploy through SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Location ''C:\Users\Administrator\Desktop\live-chat\live-chat''; git config core.autocrlf true; git fetch origin main; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $dirty = @(git status --porcelain=v1 --untracked-files=no); Write-Output ''NEMARK_DIRTY_START''; $dirty; Write-Output ''NEMARK_DIRTY_END''; if ($dirty.Count -gt 0) { exit 17 }; git pull --ff-only origin main; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & ''scripts\deploy-windows.ps1''"'
