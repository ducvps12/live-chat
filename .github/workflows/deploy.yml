name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          test -n "$FB_APP_ID"
          test -n "$FB_APP_SECRET"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          printf 'FB_APP_ID=%s\nFB_APP_SECRET=%s\nFB_REDIRECT_URI=https://api.nemarkchat.com/api/facebook/callback\n' "$FB_APP_ID" "$FB_APP_SECRET" |
            sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "cd /www/live_chat_nemark && umask 077 && touch .env.production && sed -i '/^FB_APP_ID=/d; /^FB_APP_SECRET=/d; /^FB_REDIRECT_URI=/d' .env.production && cat >> .env.production && sed -i 's/\r$//' deploy.sh && bash deploy.sh"
